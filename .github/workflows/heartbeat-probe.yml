# 一時的な調べ（2026-11-23）: 取り込みの「生きている印」が GitHub から 403（門の手前）で弾かれる理由を調べる。
# 合言葉に1文字足して送る＝受け口に届けば JSON の 403、門で弾かれれば HTML の 403。DB には何も書かない。調べ終わったら消す。
name: 印の受け口の調べ（一時）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund >/dev/null
      - name: axios で送る
        env:
          K: ${{ secrets.PUSH_NOTIFY_KEY }}
        run: |
          node -e '
          const axios = require("axios");
          const { UA } = require("./src/app_push");
          const base = { key: String(process.env.K||"").trim() + "Z", task: "info", ok: true, total: 9515,
            detail: "全大会 9515件・シティリーグ 0・その他大会 0", title: "しばらくお待ちください..." };
          const tries = [["そのまま", base], ["説明なし", { ...base, detail: "", title: "" }], ["合言葉だけ", { key: base.key, task: "info", ok: true }]];
          (async () => {
            for (const [name, b] of tries) {
              try { const r = await axios.post("https://pokemimi.com/api/ingest-heartbeat.php", b, { timeout: 15000, headers: { "User-Agent": UA } }); console.log(name, r.status); }
              catch (e) { const r = e.response || {}; const h = r.headers || {}; console.log(name, r.status, String(h["content-type"]||""), String(h["server"]||""), String(h["cf-mitigated"]||""), String(typeof r.data === "string" ? r.data : JSON.stringify(r.data)).slice(0, 120).replace(/\s+/g, " ")); }
            }
          })();'
