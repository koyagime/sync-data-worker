name: Player Rank Sync

on:
  schedule:
    # Run every hour at 00 minutes
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-rank:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node Modules & Playwright Browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-playwright-${{ hashFiles('**/package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-playwright-

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers & System Dependencies
        run: npx playwright install chromium --with-deps

      - name: Run Player Rank Task
        env:
          API_SYNC_URL: ${{ secrets.API_SYNC_URL || 'https://tcg-shop.jp/t/api_sync.php' }}
          API_KEY: ${{ secrets.API_KEY || 'pokemimi_secret_api_key_2026_x89a' }}
          HEADLESS: 'true'
        run: npm run rank
