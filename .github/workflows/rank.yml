name: Player Rank Sync

on:
  schedule:
    # Run every hour at 00 minutes
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-rank:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node Modules & Playwright Browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-playwright-${{ hashFiles('**/package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-playwright-

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers & System Dependencies
        run: npx playwright install chromium --with-deps

      - name: Run Player Rank Task
        env:
          API_SYNC_URL: ${{ secrets.API_SYNC_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          HEADLESS: 'true'
        run: npm run rank

      - name: Commit and Push State File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --quiet && git diff --staged --quiet && echo "state に変化なし" && exit 0
          git commit -m "Auto-update player rank state tracking [skip ci]"
          # ⚠ 別の実行が先に push していることがある。取り込んでからやり直す。
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push が弾かれた（$i 回目）。取り込んで再試行する"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || exit 1
            sleep $((i * 3))
          done
          echo "5回試しても push できなかった" >&2; exit 1
