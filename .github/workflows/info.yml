name: Tournament Info Monitor

on:
  schedule:
    # Run every 5 minutes (GitHub Actions minimum cron interval)
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-info]

jobs:
  run-info:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true

      - name: Cache Node Modules & Playwright Browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-playwright-${{ hashFiles('**/package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-playwright-

      - name: Install Dependencies
        run: npm ci || npm install

      # 通信しない計器。ここが赤なら「空きが出たのに通知しない」形になっている。
      - name: 計器（総数だけ聞く仕組み・通信なし）
        run: node test/info_probe.test.js

      # 通信しない計器。鍵が無いときに投げない・落ちても止めない・日付の形をそろえる。
      - name: 計器（アプリへの通知の渡し方・通信なし）
        run: node test/app_push.test.js

      - name: Install Playwright Browsers & System Dependencies
        run: npx playwright install chromium --with-deps

      - name: Run Tournament Info Task
        env:
          API_SYNC_URL: ${{ secrets.API_SYNC_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          DISCORD_CITY_WEBHOOK: ${{ secrets.DISCORD_CITY_WEBHOOK }}
          DISCORD_OTHER_WEBHOOK: ${{ secrets.DISCORD_OTHER_WEBHOOK }}
          PUSH_NOTIFY_KEY: ${{ secrets.PUSH_NOTIFY_KEY }}
          DISCORD_WEBHOOK_KANTO: ${{ secrets.DISCORD_WEBHOOK_KANTO }}
          DISCORD_WEBHOOK_KANSAI: ${{ secrets.DISCORD_WEBHOOK_KANSAI }}
          DISCORD_WEBHOOK_CHUBU: ${{ secrets.DISCORD_WEBHOOK_CHUBU }}
          DISCORD_WEBHOOK_HOKURIKU: ${{ secrets.DISCORD_WEBHOOK_HOKURIKU }}
          DISCORD_WEBHOOK_TOHOKU: ${{ secrets.DISCORD_WEBHOOK_TOHOKU }}
          DISCORD_WEBHOOK_CHUSHIKOKU: ${{ secrets.DISCORD_WEBHOOK_CHUSHIKOKU }}
          DISCORD_WEBHOOK_KYUSHU: ${{ secrets.DISCORD_WEBHOOK_KYUSHU }}
          PM_NOTIFY_DRYRUN: 'false'
          HEADLESS: 'true'
        run: npm run info

      - name: Commit and Push State File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # ⚠ 自分の state だけ（2026-10-23）。state/ を丸ごと書き戻すと、ほかの仕事の進み具合を古い写しで上書きしていた
          #   （ランキングの読み進めが 10/20 の位置へ何度も戻り、上位の更新が止まっていた）
          OWN="state/tournament_info_state.json state/upstream_health_info.json"
          for f in $OWN; do [ -f "$f" ] && git add "$f"; done
          # 🚨 2026-09-28: ここは以前 `git diff --quiet && git diff --staged --quiet` だった。
          #    前半は **作業ツリー全体**の未ステージ変更を見るので、毎回書き換わる
          #    `logs/tcg_runner.log` のせいで **常に成立しない** → 早じまいできず、
          #    何もステージされていないのに git commit へ進み、
          #    "no changes added to commit" で終了コード1 → `bash -e` でステップごと失敗していた。
          #    公式が403を返して state が変わらない回にだけ出るので、
          #    Cloudflare が厳しくなった 9/25 以降に失敗メールが日20通まで増えた。
          #    → **ステージされたものだけ**を見る。
          if git diff --staged --quiet; then echo "state に変化なし"; exit 0; fi
          # ⚠ state は毎回まるごと作り直すファイル。別の実行と衝突すると rebase では解決できない
          #    （同じ JSON を両方が書き換えるため必ず CONFLICT になる。2026-08-07 に実際に踏んだ）。
          #    → 取り込んでから **今回作った state を上書きし直す**。衝突しようがない形にする。
          KEEP=$(mktemp -d); for f in $OWN; do [ -f "$f" ] && cp "$f" "$KEEP"/; done
          git commit -m "Auto-update tournament info state tracking [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push が弾かれた（$i 回目）。取り込んで作り直した state を載せ直す"
            git fetch origin "${{ github.ref_name }}" || exit 1
            git reset --hard "origin/${{ github.ref_name }}" || exit 1
            mkdir -p state; for f in $OWN; do [ -f "$KEEP/$(basename "$f")" ] && cp "$KEEP/$(basename "$f")" "$f" && git add "$f"; done
            if git diff --staged --quiet; then echo "取り込んだら差分なし（別の実行が同じ内容を入れた）"; exit 0; fi
            git commit -m "Auto-update tournament info state tracking [skip ci]"
            sleep $((i * 3))
          done
          echo "5回試しても push できなかった" >&2; exit 1
