name: Tournament Result & Deck Sync

on:
  schedule:
    # Run every hour at 10 minutes
    - cron: '10 * * * *'
  workflow_dispatch:

jobs:
  run-result:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node Modules & Playwright Browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-playwright-${{ hashFiles('**/package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-playwright-

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers & System Dependencies
        run: npx playwright install chromium --with-deps

      - name: Run Tournament Result Task
        env:
          API_SYNC_URL: ${{ secrets.API_SYNC_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          HEADLESS: 'true'
        run: npm run result

      - name: Commit and Push State File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --quiet && git diff --staged --quiet && echo "state に変化なし" && exit 0
          # ⚠ state は毎回まるごと作り直すファイル。別の実行と衝突すると rebase では解決できない
          #    （同じ JSON を両方が書き換えるため必ず CONFLICT になる。2026-08-07 に実際に踏んだ）。
          #    → 取り込んでから **今回作った state を上書きし直す**。衝突しようがない形にする。
          KEEP=$(mktemp -d); cp -R state/. "$KEEP"/
          git commit -m "Auto-update tournament result state tracking [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push が弾かれた（$i 回目）。取り込んで作り直した state を載せ直す"
            git fetch origin "${{ github.ref_name }}" || exit 1
            git reset --hard "origin/${{ github.ref_name }}" || exit 1
            rm -rf state && mkdir -p state && cp -R "$KEEP"/. state/
            git add state/
            if git diff --staged --quiet; then echo "取り込んだら差分なし（別の実行が同じ内容を入れた）"; exit 0; fi
            git commit -m "Auto-update tournament result state tracking [skip ci]"
            sleep $((i * 3))
          done
          echo "5回試しても push できなかった" >&2; exit 1
